<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Learning Universe</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f5f6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .box {

            width: 430px;

            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);

        }


        .back {

            color: #6c4df6;

            text-decoration: none;

            font-weight: bold;

        }


        .back:hover {

            text-decoration: underline;

        }


        h1 {

            text-align: center;

            margin-top: 30px;

            margin-bottom: 10px;

            color: #20243a;

        }


        .subtitle {

            text-align: center;

            color: #697188;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #30344b;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6c4df6;

            box-shadow:
                0 0 0 3px rgba(108, 77, 246, 0.10);

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6c4df6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .login {

            text-align: center;

            margin-top: 22px;

            color: #697188;

        }


        .login a {

            color: #6c4df6;

            font-weight: bold;

            text-decoration: none;

        }


        .login a:hover {

            text-decoration: underline;

        }


        #message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;

            line-height: 1.4;

        }


        #message.success {

            display: block;

            background: #e8f8ee;

            color: #1d7a3d;

            border: 1px solid #b9e8c8;

        }


        #message.error {

            display: block;

            background: #fff0f0;

            color: #c62828;

            border: 1px solid #f2bcbc;

        }


        #message.info {

            display: block;

            background: #f0efff;

            color: #5141b5;

            border: 1px solid #d8d3ff;

        }

    </style>

</head>


<body>


<div class="box">


    <!-- BACK -->

    <a
        class="back"
        href="regular-login.html"
    >
        ← Back to Login
    </a>



    <!-- TITLE -->

    <h1>
        Forgot Password?
    </h1>


    <p class="subtitle">

        Enter your registered email address
        to reset your Learning Universe password.

    </p>



    <!-- FORM -->

    <form id="forgotForm">


        <label for="email">
            Email Address
        </label>


        <input
            id="email"
            type="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >


        <button
            id="submitButton"
            type="submit"
        >
            Continue
        </button>


    </form>



    <!-- MESSAGE -->

    <div id="message"></div>



    <!-- LOGIN -->

    <div class="login">

        Remember your password?

        <a href="regular-login.html">
            Login
        </a>

    </div>


</div>



<script>


/* =====================================
   BACKEND URL
   ===================================== */

const API_BASE_URL =
    "https://learning-universe-p57z.onrender.com";


/*
 * This endpoint will be added
 * in the backend next.
 */

const FORGOT_PASSWORD_URL =
    API_BASE_URL + "/api/forgot-password";



/* =====================================
   ELEMENTS
   ===================================== */

const forgotForm =
    document.getElementById("forgotForm");


const emailInput =
    document.getElementById("email");


const submitButton =
    document.getElementById("submitButton");


const message =
    document.getElementById("message");



/* =====================================
   MESSAGE FUNCTION
   ===================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

}



/* =====================================
   FORGOT PASSWORD
   ===================================== */

forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }



        /* Loading */

        submitButton.disabled = true;

        submitButton.textContent =
            "Checking...";


        showMessage(
            "Checking your account...",
            "info"
        );



        try {


            const response =
                await fetch(
                    FORGOT_PASSWORD_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email: email
                            })
                    }
                );



            const contentType =
                response.headers.get(
                    "content-type"
                );


            let data = {};



            if (
                contentType &&
                contentType.includes("application/json")
            ) {

                data =
                    await response.json();

            } else {

                const text =
                    await response.text();

                data = {
                    message: text
                };

            }



            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to process your request.",
                    "error"
                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Continue";

                return;
            }



            /* Success */

            showMessage(
                data.message ||
                "Account found. Continue to reset your password.",
                "success"
            );



            /*
             * The next reset-password page
             * will be connected here after
             * the backend reset system is added.
             */


        } catch (error) {

            console.error(
                "Forgot Password Error:",
                error
            );


            showMessage(
                "Backend connection failed. Please try again.",
                "error"
            );


        } finally {

            /*
             * Keep button available unless
             * the page is redirected later.
             */

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Continue";

        }

    }
);


</script>


</body>

</html>
