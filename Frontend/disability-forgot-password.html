<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Learning Universe</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef3ff,
                    #f8f9ff
                );

        }


        .box {

            width: 90%;

            max-width: 430px;

            background: white;

            padding: 40px 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);

        }


        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #5875c7;

            text-decoration: none;

            font-weight: bold;

        }


        h1 {

            margin: 0 0 12px;

            text-align: center;

            color: #222;

            font-size: 30px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 28px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            margin-bottom: 18px;

            outline: none;

        }


        input:focus {

            border-color: #6c4df6;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6c4df6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.92;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .message {

            margin-top: 18px;

            text-align: center;

            line-height: 1.5;

        }


        .success {

            color: green;

        }


        .error {

            color: #d32f2f;

        }


        .login-link {

            margin-top: 22px;

            text-align: center;

            color: #777;

        }


        .login-link a {

            color: #5875c7;

            font-weight: bold;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <div class="box">


        <a
            class="back"
            href="disability-login.html"
        >
            ← Back to Login
        </a>


        <h1>
            Forgot Password?
        </h1>


        <p class="subtitle">

            Enter your registered email address
            to reset your Learning Universe password.

        </p>


        <form id="forgotForm">


            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >


            <button
                type="submit"
                id="submitButton"
            >
                Continue
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="login-link">

            Remember your password?

            <a href="disability-login.html">
                Login
            </a>

        </div>


    </div>


    <script>

        const API_BASE_URL =
            "https://learning-universe-p57z.onrender.com";


        const FORGOT_PASSWORD_URL =
            API_BASE_URL +
            "/api/forgot-password";


        const form =
            document.getElementById(
                "forgotForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        // ----------------------------
        // FORGOT PASSWORD
        // ----------------------------

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;

                }


                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Checking...";


                showMessage(
                    "Checking your account...",
                    ""
                );


                try {

                    const response =
                        await fetch(
                            FORGOT_PASSWORD_URL,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    // ------------------------
                    // SUCCESS
                    // ------------------------

                    if (
                        response.ok &&
                        data.success &&
                        data.resetToken
                    ) {

                        showMessage(
                            "Password reset page is opening...",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "reset-password.html?token=" +
                                    encodeURIComponent(
                                        data.resetToken
                                    ) +
                                    "&mode=disability";

                            },
                            500
                        );


                        return;

                    }


                    // ------------------------
                    // ERROR
                    // ------------------------

                    showMessage(
                        data.message ||
                        "Unable to start password reset.",
                        "error"
                    );


                } catch (error) {

                    console.error(
                        "Forgot Password Error:",
                        error
                    );


                    showMessage(
                        "Backend connection failed. Please try again.",
                        "error"
                    );


                } finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Continue";

                }

            }
        );

    </script>


</body>

</html>
