<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Regular Student Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f5f6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .box {

            width: 430px;

            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.12);

        }


        .back {

            text-decoration: none;

            color: #6c4df6;

            font-weight: bold;

        }


        h1 {

            text-align: center;

            margin-top: 30px;

            margin-bottom: 10px;

            color: #20243a;

        }


        p {

            text-align: center;

            color: #697188;

        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #30344b;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6c4df6;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: #6c4df6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* =========================
           FORGOT PASSWORD
           ========================= */

        .forgot {

            text-align: right;

            margin-top: 10px;

        }


        .forgot a {

            color: #6c4df6;

            font-size: 14px;

            font-weight: bold;

            text-decoration: none;

        }


        .forgot a:hover {

            text-decoration: underline;

        }


        /* =========================
           REGISTER
           ========================= */

        .register {

            text-align: center;

            margin-top: 22px;

            color: #697188;

        }


        .register a {

            color: #6c4df6;

            font-weight: bold;

            text-decoration: none;

        }


        .register a:hover {

            text-decoration: underline;

        }


        /* =========================
           MESSAGE
           ========================= */

        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            line-height: 1.4;

        }


        #message.success {

            color: #1d7a3d;

        }


        #message.error {

            color: #c62828;

        }


        #message.info {

            color: #5141b5;

        }

    </style>

</head>


<body>


<div class="box">


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >
        ← Back to Home
    </a>



    <!-- TITLE -->

    <h1>
        Regular Student Login
    </h1>


    <p>
        Login to continue learning.
    </p>



    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <label for="email">
            Email Address
        </label>


        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >



        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>


        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >



        <!-- FORGOT PASSWORD -->

        <div class="forgot-password">

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>



        <!-- LOGIN BUTTON -->

        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>


    </form>



    <!-- MESSAGE -->

    <div id="message"></div>



    <!-- REGISTER -->

    <div class="register">

        Don't have an account?

        <a href="regular-register.html">
            Register
        </a>

    </div>


</div>



<script>


/* =====================================
   ELEMENTS
   ===================================== */

const loginForm =
    document.getElementById("loginForm");


const message =
    document.getElementById("message");


const loginButton =
    document.getElementById("loginButton");



/* =====================================
   LOGIN FORM
   ===================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;



        /* ================================
           SHOW LOADING
           ================================ */

        message.textContent =
            "Logging in...";

        message.className =
            "info";


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";



        try {


            /* ================================
               BACKEND LOGIN
               ================================ */

            const response =
                await fetch(
                    "https://learning-universe-p57z.onrender.com/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                email: email,

                                password: password

                            })
                    }
                );



            /* ================================
               READ RESPONSE
               ================================ */

            const contentType =
                response.headers.get(
                    "content-type"
                );


            let data = {};


            if (
                contentType &&
                contentType.includes("application/json")
            ) {

                data =
                    await response.json();

            } else {

                const text =
                    await response.text();

                data = {
                    message: text
                };

            }



            /* ================================
               LOGIN ERROR
               ================================ */

            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Login failed.";

                message.className =
                    "error";


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;
            }



            /* ================================
               SAVE LOGIN DATA
               ================================ */

            localStorage.setItem(
                "token",
                data.token
            );


            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            /*
             * Regular student mode.
             *
             * Edith should NOT start
             * for regular students.
             */

            localStorage.setItem(
                "accessibilityMode",
                "regular"
            );



            /* ================================
               SUCCESS
               ================================ */

            message.textContent =
                "Login successful ✅";

            message.className =
                "success";


            loginButton.textContent =
                "Login Successful ✓";



            /* ================================
               REDIRECT
               ================================ */

            setTimeout(
                function() {

                    window.location.href =
                        "regular-dashboard.html";

                },
                700
            );


        } catch (error) {


            console.error(
                "Login Error:",
                error
            );


            message.textContent =
                "Backend connection failed. Please try again.";

            message.className =
                "error";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);


</script>


</body>

</html>
