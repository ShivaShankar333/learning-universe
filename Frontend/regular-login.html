<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Student Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 430px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
        }

        .back {
            text-decoration: none;
            color: #6c4df6;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
        }

        p {
            text-align: center;
            color: #697188;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #6c4df6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register {
            text-align: center;
            margin-top: 22px;
        }

        .register a {
            color: #6c4df6;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Regular Student Login</h1>

    <p>Login to continue learning.</p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="regular-register.html">
            Register
        </a>
    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Logging in...";

        try {

            const response = await fetch(
                "http://localhost:3000/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {

                message.textContent =
                    data.message || "Login failed";

                return;
            }

            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            message.textContent =
                "Login successful ✅";

            setTimeout(function() {

                window.location.href =
                    "regular-dashboard.html";

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Backend connection failed.";

        }

    }
);

</script>

</body>
</html>
