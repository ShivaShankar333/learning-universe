<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programming Courses - Learning Universe</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6ff;
    color: #20243a;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    color: #6c4df6;
    font-size: 24px;
    font-weight: bold;
}

nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #30344b;
    font-weight: bold;
}

nav a:hover {
    color: #6c4df6;
}

.hero {
    text-align: center;
    padding: 55px 20px 35px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero h1 span {
    color: #6c4df6;
}

.hero p {
    color: #697188;
    font-size: 18px;
}

.courses {
    padding: 20px 7% 70px;
}

.course-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.course-card {
    background: white;
    padding: 28px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(40,40,80,0.08);
    cursor: pointer;
    transition: 0.2s;
}

.course-card:hover {
    transform: translateY(-5px);
}

.course-card:focus {
    outline: 4px solid #16a085;
    outline-offset: 4px;
}

.course-icon {
    font-size: 55px;
}

.course-card h2 {
    margin: 15px 0 8px;
}

.course-card p {
    color: #697188;
}

.videos-section {
    display: none;
    padding: 40px 7% 70px;
}

.videos-section.active {
    display: block;
}

.back-button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #6c4df6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.back-button:focus,
.watch-button:focus,
.close-button:focus {
    outline: 4px solid #16a085;
    outline-offset: 3px;
}

.videos-section h2 {
    text-align: center;
    font-size: 30px;
}

.channel-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 30px;
}

.video-card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(40,40,80,0.09);
}

.video-info {
    padding: 18px;
}

.video-info h3 {
    margin: 0 0 8px;
}

.channel-name {
    color: #6c4df6;
    font-weight: bold;
    margin-bottom: 15px;
}

.watch-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #6c4df6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.player {
    display: none;
    max-width: 1000px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(40,40,80,0.12);
}

.player.active {
    display: block;
}

.player h2 {
    margin-top: 0;
}

.iframe-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 14px;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.close-button {
    margin-top: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 9px;
    background: #30344b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.edith-message {
    position: fixed;
    left: 20px;
    bottom: 20px;
    padding: 14px 20px;
    border-radius: 12px;
    background: #20243a;
    color: white;
    font-weight: bold;
    z-index: 9999;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
}

footer {
    background: #20243a;
    color: white;
    text-align: center;
    padding: 25px;
}

@media (max-width: 1000px) {

    .course-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .channel-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    nav {
        display: none;
    }

    .course-grid,
    .channel-grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 32px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Learning Universe 🌌
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="courses.html">
            Courses
        </a>

        <a href="accessibility.html">
            Accessibility
        </a>

        <a href="missions.html">
            Missions
        </a>

        <a href="career.html">
            Career
        </a>

    </nav>

</header>


<main>


<section class="hero">

    <h1>
        Programming <span>Courses</span> 💻
    </h1>

    <p id="courseInstruction">
        Select a programming language to start learning.
        You can also say "Hey Edith, open Python".
    </p>

</section>


<!-- =========================
     COURSE LIST
========================= -->

<section
    class="courses"
    id="coursesSection"
    aria-label="Programming courses">

    <div
        class="course-grid"
        id="courseGrid">
    </div>

</section>


<!-- =========================
     VIDEOS
========================= -->

<section
    class="videos-section"
    id="videosSection"
    aria-labelledby="selectedCourseTitle">

    <button
        class="back-button"
        type="button"
        onclick="showCourses()">

        ← Back to Programming Languages

    </button>

    <h2 id="selectedCourseTitle">
        Course Videos
    </h2>

    <p
        id="videoInstruction"
        class="sr-only"
        aria-live="polite">
    </p>

    <div
        class="channel-grid"
        id="channelGrid">
    </div>

</section>


<!-- =========================
     VIDEO PLAYER
========================= -->

<section
    class="player"
    id="player"
    aria-labelledby="playerTitle">

    <h2 id="playerTitle">
        Video
    </h2>

    <div class="iframe-wrapper">

        <iframe
            id="youtubePlayer"
            title="Learning Universe Video Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>

    <button
        class="close-button"
        type="button"
        onclick="closeVideo()">

        ✕ Close Video

    </button>

</section>


<div
    id="edithMessage"
    class="edith-message"
    aria-live="polite">

    Edith is ready for voice commands.

</div>


<div
    id="announcement"
    class="sr-only"
    aria-live="assertive"
    aria-atomic="true">
</div>


</main>


<footer>

    © 2026 Learning Universe

</footer>


<script>


/* ==========================================
   COURSES
========================================== */

const courses = [

    {
        name: "Java Programming",
        icon: "☕",
        level: "Beginner"
    },

    {
        name: "Python Programming",
        icon: "🐍",
        level: "Beginner"
    },

    {
        name: "C Programming",
        icon: "💻",
        level: "Beginner"
    },

    {
        name: "C++ Programming",
        icon: "⚙️",
        level: "Intermediate"
    },

    {
        name: "JavaScript",
        icon: "⚡",
        level: "Intermediate"
    },

    {
        name: "Web Development",
        icon: "🌐",
        level: "Beginner"
    },

    {
        name: "SQL & Databases",
        icon: "🗄️",
        level: "Intermediate"
    },

    {
        name: "AI & Machine Learning",
        icon: "🤖",
        level: "Advanced"
    }

];


/* ==========================================
   VIDEO DATA
========================================== */

const videos = {

    "Java Programming": [

        {
            title: "Java Full Course for Beginners",
            channel: "Java Course 1",
            id: "eIrMbAQSU34"
        },

        {
            title: "Java Programming Course",
            channel: "Java Course 2",
            id: "BGTx91t8q50"
        },

        {
            title: "Java Programming Tutorial",
            channel: "Java Course 3",
            id: "ZFnRvpxpnOc"
        },

        {
            title: "Java Full Course",
            channel: "Java Course 4",
            id: "xTtL8E4LzTQ"
        },

        {
            title: "Java Programming for Beginners",
            channel: "Java Course 5",
            id: "A74TOX803D0"
        },

        {
            title: "Java OOP Concepts",
            channel: "Durga Sir",
            id: "5NQjLBuNL0I"
        }

    ],


    "Python Programming": [

        {
            title: "Python Programming Course",
            channel: "Python Learning Channel 1",
            id: "VIDEO_ID_1"
        },

        {
            title: "Python for Beginners",
            channel: "Python Learning Channel 2",
            id: "VIDEO_ID_2"
        },

        {
            title: "Complete Python Tutorial",
            channel: "Python Learning Channel 3",
            id: "VIDEO_ID_3"
        },

        {
            title: "Python Full Course",
            channel: "Python Learning Channel 4",
            id: "VIDEO_ID_4"
        },

        {
            title: "Python Basics",
            channel: "Python Learning Channel 5",
            id: "VIDEO_ID_5"
        },

        {
            title: "Python Advanced Course",
            channel: "Python Learning Channel 6",
            id: "VIDEO_ID_6"
        }

    ],


    "C Programming": [

        {
            title: "C Programming Course",
            channel: "C Learning Channel 1",
            id: "VIDEO_ID_1"
        },

        {
            title: "C Programming for Beginners",
            channel: "C Learning Channel 2",
            id: "VIDEO_ID_2"
        },

        {
            title: "Complete C Tutorial",
            channel: "C Learning Channel 3",
            id: "VIDEO_ID_3"
        },

        {
            title: "C Full Course",
            channel: "C Learning Channel 4",
            id: "VIDEO_ID_4"
        },

        {
            title: "C Programming Basics",
            channel: "C Learning Channel 5",
            id: "VIDEO_ID_5"
        },

        {
            title: "Advanced C Programming",
            channel: "C Learning Channel 6",
            id: "VIDEO_ID_6"
        }

    ],


    "C++ Programming": [],

    "JavaScript": [],

    "Web Development": [],

    "SQL & Databases": [],

    "AI & Machine Learning": []

};


/* ==========================================
   ANNOUNCEMENT
========================================== */

function announce(message) {

    const box =
        document.getElementById("announcement");

    box.textContent = "";

    setTimeout(function() {

        box.textContent = message;

    }, 50);

}


/* ==========================================
   DISPLAY COURSES
========================================== */

function displayCourses() {

    const grid =
        document.getElementById("courseGrid");

    grid.innerHTML = "";


    courses.forEach(function(course, index) {

        const card =
            document.createElement("div");

        card.className =
            "course-card";

        card.tabIndex = 0;

        card.setAttribute(
            "role",
            "button"
        );

        card.setAttribute(
            "aria-label",
            "Open " + course.name +
            ", " + course.level
        );


        card.innerHTML = `

            <div class="course-icon"
                 aria-hidden="true">

                ${course.icon}

            </div>

            <h2>
                ${course.name}
            </h2>

            <p>
                ${course.level}
            </p>

        `;


        card.addEventListener(
            "click",
            function() {

                showVideos(course.name);

            }
        );


        card.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    showVideos(course.name);

                }

            }
        );


        grid.appendChild(card);

    });

}


/* ==========================================
   SHOW VIDEOS
========================================== */

function showVideos(courseName) {

    document.getElementById(
        "coursesSection"
    ).style.display = "none";


    document.getElementById(
        "videosSection"
    ).classList.add("active");


    document.getElementById(
        "selectedCourseTitle"
    ).textContent =
        courseName + " - Learning Videos";


    const grid =
        document.getElementById("channelGrid");

    grid.innerHTML = "";


    const courseVideos =
        videos[courseName] || [];


    announce(
        courseName +
        " opened. " +
        courseVideos.length +
        " learning videos available."
    );


    if (courseVideos.length === 0) {

        grid.innerHTML = `

            <div class="video-card">

                <div class="video-info">

                    <h3>
                        Videos Coming Soon
                    </h3>

                    <p>
                        Quality learning videos
                        for this course will be
                        added soon.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    courseVideos.forEach(
        function(video, index) {

            const card =
                document.createElement("div");

            card.className =
                "video-card";


            card.innerHTML = `

                <div class="video-info">

                    <h3>
                        🎥 ${video.title}
                    </h3>

                    <div class="channel-name">
                        ${video.channel}
                    </div>

                    <button
                        class="watch-button"
                        type="button"
                        aria-label="Watch ${video.title}">

                        ▶ Watch Class

                    </button>

                </div>

            `;


            const watchButton =
                card.querySelector(
                    ".watch-button"
                );


            watchButton.addEventListener(
                "click",
                function() {

                    playVideo(
                        video.id,
                        video.title,
                        video.channel
                    );

                }
            );


            grid.appendChild(card);

        }
    );

}


/* ==========================================
   PLAY VIDEO
========================================== */

function playVideo(
    videoId,
    title,
    channel
) {

    if (
        !videoId ||
        videoId.startsWith("VIDEO_ID_")
    ) {

        announce(
            "This video is not available yet."
        );

        return;

    }


    const player =
        document.getElementById("player");

    const iframe =
        document.getElementById(
            "youtubePlayer"
        );

    const titleBox =
        document.getElementById(
            "playerTitle"
        );


    titleBox.textContent =
        "Playing " +
        title +
        " by " +
        channel;


    iframe.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";


    player.classList.add("active");


    announce(
        "Playing " +
        title +
        " by " +
        channel
    );


    player.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* ==========================================
   CLOSE VIDEO
========================================== */

function closeVideo() {

    const player =
        document.getElementById("player");

    const iframe =
        document.getElementById(
            "youtubePlayer"
        );


    iframe.src = "";

    player.classList.remove("active");


    announce(
        "Video closed."
    );

}


/* ==========================================
   BACK TO COURSES
========================================== */

function showCourses() {

    closeVideo();


    document.getElementById(
        "videosSection"
    ).classList.remove("active");


    document.getElementById(
        "coursesSection"
    ).style.display = "block";


    announce(
        "Programming courses are available."
    );

}


/* ==========================================
   EDITH PAGE COMMANDS
========================================== */

/*
   edith.js can call this function
   when the user gives a voice command.
*/

window.edithPageCommand =
function(command) {

    if (!command) {
        return false;
    }


    command =
        command
        .toLowerCase()
        .trim();


    /* =========================
       BACK
    ========================= */

    if (
        command.includes("go back") ||
        command.includes("back to courses") ||
        command.includes("show courses") ||
        command.includes("show all courses")
    ) {

        showCourses();

        return true;

    }


    /* =========================
       CLOSE VIDEO
    ========================= */

    if (
        command.includes("close video") ||
        command.includes("stop video")
    ) {

        closeVideo();

        return true;

    }


    /* =========================
       OPEN COURSE
    ========================= */

    if (
        command.includes("python")
    ) {

        showVideos(
            "Python Programming"
        );

        return true;

    }


    if (
        command.includes("java")
    ) {

        showVideos(
            "Java Programming"
        );

        return true;

    }


    if (
        command.includes("c plus plus") ||
        command.includes("c++")
    ) {

        showVideos(
            "C++ Programming"
        );

        return true;

    }


    if (
        command.includes("c programming") ||
        command === "open c" ||
        command.includes("learn c")
    ) {

        showVideos(
            "C Programming"
        );

        return true;

    }


    if (
        command.includes("javascript") ||
        command.includes("java script")
    ) {

        showVideos(
            "JavaScript"
        );

        return true;

    }


    if (
        command.includes("web development") ||
        command.includes("web development course")
    ) {

        showVideos(
            "Web Development"
        );

        return true;

    }


    if (
        command.includes("sql") ||
        command.includes("database")
    ) {

        showVideos(
            "SQL & Databases"
        );

        return true;

    }


    if (
        command.includes("machine learning") ||
        command.includes("artificial intelligence") ||
        command.includes("ai course")
    ) {

        showVideos(
            "AI & Machine Learning"
        );

        return true;

    }


    /* =========================
       READ AVAILABLE COURSES
    ========================= */

    if (
        command.includes("read courses") ||
        command.includes("list courses") ||
        command.includes("what courses") ||
        command.includes("available courses")
    ) {

        const names =
            courses
            .map(function(course) {
                return course.name;
            })
            .join(", ");


        if (
            typeof speak === "function"
        ) {

            speak(
                "Available courses are: " +
                names
            );

        }


        return true;

    }


    return false;

};


/* ==========================================
   START
========================================== */

displayCourses();

/*===========================================
  EDITH SCRIPT
========================================== */

</script>

<script src="edith.js"></script>

</body>
</html>
