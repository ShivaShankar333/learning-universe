<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programming Courses - Learning Universe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            color: #20243a;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #6c4df6;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #30344b;
            font-weight: bold;
        }

        nav a:hover {
            color: #6c4df6;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #6c4df6;
        }

        .hero p {
            color: #697188;
            font-size: 18px;
        }

        .courses {
            padding: 20px 7% 70px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .course-card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(40,40,80,0.08);
            cursor: pointer;
            transition: 0.2s;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(40,40,80,0.15);
        }

        .course-icon {
            font-size: 55px;
        }

        .course-card h2 {
            margin: 15px 0 8px;
        }

        .course-card p {
            color: #697188;
        }

        .videos-section {
            display: none;
            padding: 40px 7% 70px;
        }

        .videos-section.active {
            display: block;
        }

        .back-button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #6c4df6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .videos-section h2 {
            text-align: center;
            font-size: 30px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 30px;
        }

        .video-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(40,40,80,0.09);
        }

        .video-info {
            padding: 18px;
        }

        .video-info h3 {
            margin: 0 0 8px;
        }

        .channel-name {
            color: #6c4df6;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .watch-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #6c4df6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .player {
            display: none;
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(40,40,80,0.12);
        }

        .player.active {
            display: block;
        }

        .player h2 {
            margin-top: 0;
        }

        .iframe-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 14px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .close-button {
            margin-top: 15px;
            padding: 11px 18px;
            border: none;
            border-radius: 9px;
            background: #30344b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            background: #20243a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 1000px) {
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            nav {
                display: none;
            }

            .course-grid,
            .channel-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>


<body>


<header>

    <div class="logo">
        Learning Universe 🌌
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="accessibility.html">Accessibility</a>
        <a href="missions.html">Missions</a>
        <a href="career.html">Career</a>
    </nav>

</header>


<section class="hero">

    <h1>
        Programming <span>Courses</span> 💻
    </h1>

    <p>
        Select a programming language to start learning.
    </p>

</section>


<!-- PROGRAMMING LANGUAGES -->

<section class="courses" id="coursesSection">

    <div class="course-grid" id="courseGrid"></div>

</section>


<!-- VIDEOS -->

<section class="videos-section" id="videosSection">

    <button
        class="back-button"
        onclick="showCourses()">

        ← Back to Programming Languages

    </button>

    <h2 id="selectedCourseTitle">
        Course Videos
    </h2>

    <div
        class="channel-grid"
        id="channelGrid">
    </div>

</section>


<!-- VIDEO PLAYER -->

<section
    class="player"
    id="player">

    <h2 id="playerTitle">
        Video
    </h2>

    <div class="iframe-wrapper">

        <iframe
            id="youtubePlayer"
            title="Learning Universe Video Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>

    <button
        class="close-button"
        onclick="closeVideo()">

        ✕ Close Video

    </button>

</section>


<footer>

    © 2026 Learning Universe

</footer>


<script>


/* ==========================================
   PROGRAMMING LANGUAGES
========================================== */

const courses = [

    {
        name: "Java Programming",
        icon: "☕",
        level: "Beginner"
    },

    {
        name: "Python Programming",
        icon: "🐍",
        level: "Beginner"
    },

    {
        name: "C Programming",
        icon: "💻",
        level: "Beginner"
    },

    {
        name: "C++ Programming",
        icon: "⚙️",
        level: "Intermediate"
    },

    {
        name: "JavaScript",
        icon: "⚡",
        level: "Intermediate"
    },

    {
        name: "Web Development",
        icon: "🌐",
        level: "Beginner"
    },

    {
        name: "SQL & Databases",
        icon: "🗄️",
        level: "Intermediate"
    },

    {
        name: "AI & Machine Learning",
        icon: "🤖",
        level: "Advanced"
    }

];



/* ==========================================
   VIDEO DATA

   Each course will have 6 different
   learning channels/videos.

   IMPORTANT:
   Replace IDs with the actual YouTube
   video IDs that we select.
========================================== */

const videos = {

    "Java Programming": [

    {
        title: "Java Full Course for Beginners",
        channel: "Java Course 1",
        id: "eIrMbAQSU34"
    },

    {
        title: "Java Programming Course",
        channel: "Java Course 2",
        id: "BGTx91t8q50"
    },

    {
        title: "Java Programming Tutorial",
        channel: "Java Course 3",
        id: "ZFnRvpxpnOc"
    },

    {
        title: "Java Full Course",
        channel: "Java Course 4",
        id: "xTtL8E4LzTQ"
    },

    {
        title: "Java Programming for Beginners",
        channel: "Java Course 5",
        id: "A74TOX803D0"
    },

    {
        title: "Java OOP Concepts",
        channel: "Durga Sir",
        id: "5NQjLBuNL0I"
    }

],

    "Python Programming": [

        {
            title: "Python Programming Course",
            channel: "Python Learning Channel 1",
            id: "VIDEO_ID_1"
        },

        {
            title: "Python for Beginners",
            channel: "Python Learning Channel 2",
            id: "VIDEO_ID_2"
        },

        {
            title: "Complete Python Tutorial",
            channel: "Python Learning Channel 3",
            id: "VIDEO_ID_3"
        },

        {
            title: "Python Full Course",
            channel: "Python Learning Channel 4",
            id: "VIDEO_ID_4"
        },

        {
            title: "Python Basics",
            channel: "Python Learning Channel 5",
            id: "VIDEO_ID_5"
        },

        {
            title: "Python Advanced Course",
            channel: "Python Learning Channel 6",
            id: "VIDEO_ID_6"
        }

    ],


    "C Programming": [

        {
            title: "C Programming Course",
            channel: "C Learning Channel 1",
            id: "VIDEO_ID_1"
        },

        {
            title: "C Programming for Beginners",
            channel: "C Learning Channel 2",
            id: "VIDEO_ID_2"
        },

        {
            title: "Complete C Tutorial",
            channel: "C Learning Channel 3",
            id: "VIDEO_ID_3"
        },

        {
            title: "C Full Course",
            channel: "C Learning Channel 4",
            id: "VIDEO_ID_4"
        },

        {
            title: "C Programming Basics",
            channel: "C Learning Channel 5",
            id: "VIDEO_ID_5"
        },

        {
            title: "Advanced C Programming",
            channel: "C Learning Channel 6",
            id: "VIDEO_ID_6"
        }

    ],


    "C++ Programming": [],

    "JavaScript": [],

    "Web Development": [],

    "SQL & Databases": [],

    "AI & Machine Learning": []

};



/* ==========================================
   DISPLAY COURSES
========================================== */

function displayCourses() {

    const grid =
        document.getElementById("courseGrid");

    grid.innerHTML = "";


    courses.forEach(function(course) {

        const card =
            document.createElement("div");

        card.className = "course-card";


        card.innerHTML = `

            <div class="course-icon">
                ${course.icon}
            </div>

            <h2>
                ${course.name}
            </h2>

            <p>
                ${course.level}
            </p>

        `;


        card.onclick = function() {

            showVideos(course.name);

        };


        grid.appendChild(card);

    });

}



/* ==========================================
   SHOW VIDEOS
========================================== */

function showVideos(courseName) {

    document.getElementById(
        "coursesSection"
    ).style.display = "none";


    document.getElementById(
        "videosSection"
    ).classList.add("active");


    document.getElementById(
        "selectedCourseTitle"
    ).textContent =
        courseName + " - Learning Videos";


    const grid =
        document.getElementById("channelGrid");


    grid.innerHTML = "";


    const courseVideos =
        videos[courseName] || [];


    if (courseVideos.length === 0) {

        grid.innerHTML = `

            <div class="video-card">

                <div class="video-info">

                    <h3>
                        Videos Coming Soon
                    </h3>

                    <p>
                        We are adding quality
                        learning videos for this course.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    courseVideos.forEach(function(video) {

        const card =
            document.createElement("div");

        card.className =
            "video-card";


        card.innerHTML = `

            <div class="video-info">

                <h3>
                    🎥 ${video.title}
                </h3>

                <div class="channel-name">
                    ${video.channel}
                </div>

                <button
                    class="watch-button">

                    ▶ Watch Class

                </button>

            </div>

        `;


        card.querySelector(
            ".watch-button"
        ).onclick = function() {

            playVideo(
                video.id,
                video.title,
                video.channel
            );

        };


        grid.appendChild(card);

    });

}



/* ==========================================
   PLAY VIDEO INSIDE WEBSITE
========================================== */

function playVideo(
    videoId,
    title,
    channel
) {

    const player =
        document.getElementById("player");

    const iframe =
        document.getElementById("youtubePlayer");

    const titleBox =
        document.getElementById("playerTitle");


    titleBox.textContent =
        "▶ " + title +
        " — " + channel;


    iframe.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";


    player.classList.add("active");


    player.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}



/* ==========================================
   CLOSE VIDEO
========================================== */

function closeVideo() {

    const player =
        document.getElementById("player");

    const iframe =
        document.getElementById("youtubePlayer");


    iframe.src = "";

    player.classList.remove("active");

}



/* ==========================================
   BACK TO COURSES
========================================== */

function showCourses() {

    document.getElementById(
        "videosSection"
    ).classList.remove("active");


    document.getElementById(
        "coursesSection"
    ).style.display = "block";


    closeVideo();

}



/* ==========================================
   START
========================================== */

displayCourses();

</script>

</body>

</html>
