<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Accessibility Student Login - Learning Universe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef0ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #20243a;
        }

        .login-container {
            width: 470px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(40, 40, 80, 0.14);
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #6c4df6;
            text-decoration: none;
            font-weight: bold;
        }

        .back:focus,
        button:focus,
        input:focus,
        a:focus {
            outline: 4px solid #16a085;
            outline-offset: 3px;
        }

        .icon {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            background: #eeeaff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 12px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #697188;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #dfe1ec;
            border-radius: 12px;
            font-size: 16px;
        }

        .voice-button,
        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .voice-button {
            margin-top: 18px;
            background: #eeeaff;
            color: #5b3fe0;
        }

        .login-btn {
            margin-top: 20px;
            background: #6c4df6;
            color: white;
        }

        .voice-button:disabled,
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .help {
            margin-top: 22px;
            padding: 18px;
            background: #f7f5ff;
            border-radius: 14px;
            color: #555d75;
            line-height: 1.7;
            font-size: 14px;
        }

        .status {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .register-text {
            text-align: center;
            margin-top: 24px;
            color: #697188;
        }

        .register-text a {
            color: #6c4df6;
            font-weight: bold;
            text-decoration: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .mode-label {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #f0edff;
            color: #5b3fe0;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div
    class="login-container"
    role="main"
    aria-labelledby="pageTitle">


    <a
        class="back"
        href="index.html"
        aria-label="Back to Learning Universe home">

        ← Back to Home

    </a>


    <div
        id="modeIcon"
        class="icon"
        aria-hidden="true">

        ♿

    </div>


    <h1 id="pageTitle">
        Accessibility Student Login
    </h1>


    <div
        id="modeLabel"
        class="mode-label">

        Accessibility Mode

    </div>


    <p
        id="subtitle"
        class="subtitle">

        Accessible login for Learning Universe students.

    </p>


    <div
        id="announcement"
        class="sr-only"
        aria-live="assertive"
        aria-atomic="true">
    </div>


    <form id="loginForm">


        <label for="email">
            Email Address
        </label>


        <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="Enter your email"
            required
        >


        <button
            id="voiceButton"
            class="voice-button"
            type="button">

            🎤 Start Voice Email Input

        </button>


        <label for="password">
            Password
        </label>


        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
        >
        
        <div class="forgot-password">
    <a href="forgot-password.html">
        Forgot Password?
    </a>
</div>


        <button
            id="loginButton"
            class="login-btn"
            type="submit">

            Login

        </button>


    </form>


    <div
        id="help"
        class="help">

        <strong>Accessibility Help</strong>

        <br><br>

        Use <strong>Tab</strong> to move between controls
        and <strong>Enter</strong> to select.

    </div>


    <div
        id="status"
        class="status"
        role="status"
        aria-live="assertive">
    </div>


    <div class="register-text">

        Don't have an account?

        <a href="disability-register.html">
            Register
        </a>

    </div>


</div>


<script>

"use strict";


/* ==========================================
   GET SELECTED ACCESSIBILITY MODE
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let mode =
    params.get("mode");


/*
   If no mode exists, use the mode already
   saved in localStorage.
*/

if (!mode) {

    mode =
        localStorage.getItem(
            "accessibilityMode"
        );

}


/*
   Final fallback.
*/

if (
    mode !== "blind" &&
    mode !== "deaf"
) {

    mode = "blind";

}


/* ==========================================
   ELEMENTS
========================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const voiceButton =
    document.getElementById("voiceButton");

const loginButton =
    document.getElementById("loginButton");

const statusBox =
    document.getElementById("status");

const announcement =
    document.getElementById("announcement");

const modeIcon =
    document.getElementById("modeIcon");

const modeLabel =
    document.getElementById("modeLabel");

const subtitle =
    document.getElementById("subtitle");

const help =
    document.getElementById("help");


/* ==========================================
   SAVE MODE
========================================== */

localStorage.setItem(
    "accessibilityMode",
    mode
);


/* ==========================================
   VOICE FUNCTION
========================================== */

function speak(text) {

    if (
        mode !== "blind"
    ) {
        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    window.speechSynthesis.cancel();


    const message =
        new SpeechSynthesisUtterance(
            text
        );


    message.rate = 0.9;
    message.pitch = 1;
    message.volume = 1;


    window.speechSynthesis.speak(
        message
    );

}


/* ==========================================
   ANNOUNCEMENT
========================================== */

function announce(text) {

    announcement.textContent = "";


    setTimeout(function () {

        announcement.textContent =
            text;


        if (
            mode === "blind"
        ) {

            speak(text);

        }

    }, 80);

}


/* ==========================================
   APPLY MODE UI
========================================== */

function applyAccessibilityMode() {


    if (
        mode === "blind"
    ) {


        modeIcon.textContent =
            "🔊";


        modeLabel.textContent =
            "🔊 Blind Mode";


        subtitle.textContent =
            "Voice-assisted accessible login for blind learners.";


        voiceButton.style.display =
            "block";


        help.innerHTML =

            "<strong>Blind Mode Help</strong><br><br>" +

            "Voice guidance is enabled automatically.<br>" +

            "Press <strong>V</strong> to start voice input for your email.<br>" +

            "Your password will remain private and will not be spoken aloud.<br>" +

            "Use <strong>Tab</strong> to move between controls and <strong>Enter</strong> to select.";


        localStorage.setItem(
            "voiceGuidance",
            "enabled"
        );


    } else {


        modeIcon.textContent =
            "👂";


        modeLabel.textContent =
            "👂 Deaf Mode";


        subtitle.textContent =
            "Visual accessibility login for deaf learners.";


        voiceButton.style.display =
            "none";


        help.innerHTML =

            "<strong>Deaf Mode Help</strong><br><br>" +

            "Visual instructions and status messages are enabled.<br>" +

            "Use <strong>Tab</strong> to move between controls and <strong>Enter</strong> to select.";


        localStorage.setItem(
            "voiceGuidance",
            "disabled"
        );

    }

}


/* ==========================================
   PAGE LOAD
========================================== */

applyAccessibilityMode();


window.addEventListener(
    "load",
    function () {

        setTimeout(function () {

            if (
                mode === "blind"
            ) {

                announce(
                    "Blind Mode selected. " +
                    "Voice guidance is enabled automatically. " +
                    "Accessibility Student Login page opened. " +
                    "Press V to enter your email using voice."
                );

            } else {

                announce(
                    "Deaf Mode selected. " +
                    "Accessibility Student Login page opened."
                );

            }

        }, 500);

    }
);


/* ==========================================
   VOICE EMAIL
========================================== */

function startVoiceEmail() {


    if (
        mode !== "blind"
    ) {
        return;
    }


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        announce(
            "Voice input is not supported by this browser. " +
            "Please enter your email manually."
        );


        emailInput.focus();

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    voiceButton.textContent =
        "🎙️ Listening...";


    voiceButton.disabled =
        true;


    announce(
        "Voice input started. Please say your email address."
    );


    try {

        recognition.start();

    } catch (error) {

        voiceButton.disabled =
            false;


        voiceButton.textContent =
            "🎤 Start Voice Email Input";


        announce(
            "Voice input could not be started. Please try again."
        );

        return;

    }


    recognition.onresult =
        function (event) {


            let result =
                event.results[0][0]
                    .transcript;


            result =
                result
                    .toLowerCase()
                    .trim();


            result =
                result
                    .replace(
                        /\s+at\s+/g,
                        "@"
                    )
                    .replace(
                        /\s+attherate\s+/g,
                        "@"
                    )
                    .replace(
                        /\s+dot\s+/g,
                        "."
                    )
                    .replace(
                        /\s+period\s+/g,
                        "."
                    )
                    .replace(
                        /\s+/g,
                        ""
                    );


            emailInput.value =
                result;


            voiceButton.disabled =
                false;


            voiceButton.textContent =
                "🎤 Start Voice Email Input";


            announce(
                "Email entered. " +
                "Now enter your password. " +
                "Your password will remain private."
            );


            passwordInput.focus();

        };


    recognition.onerror =
        function () {


            voiceButton.disabled =
                false;


            voiceButton.textContent =
                "🎤 Start Voice Email Input";


            announce(
                "Voice input was not completed. Please try again."
            );

        };


    recognition.onend =
        function () {

            voiceButton.disabled =
                false;


            voiceButton.textContent =
                "🎤 Start Voice Email Input";

        };

}


/* ==========================================
   VOICE BUTTON
========================================== */

voiceButton.addEventListener(
    "click",
    function () {

        startVoiceEmail();

    }
);


/* ==========================================
   V KEY
========================================== */

document.addEventListener(
    "keydown",
    function (event) {


        if (
            mode !== "blind"
        ) {
            return;
        }


        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }


        if (
            event.key.toLowerCase() === "v"
        ) {

            event.preventDefault();

            startVoiceEmail();

        }

    }
);


/* ==========================================
   PASSWORD PRIVACY
========================================== */

passwordInput.addEventListener(
    "focus",
    function () {


        if (
            mode === "blind"
        ) {

            announce(
                "Password field selected. " +
                "For your security, your password will not be spoken aloud."
            );

        }

    }
);


/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim();


        const password =
            passwordInput.value;


        if (!email) {

            statusBox.style.display =
                "block";


            statusBox.textContent =
                "Email address is required.";


            announce(
                "Email address is required."
            );


            emailInput.focus();

            return;

        }


        if (!password) {

            statusBox.style.display =
                "block";


            statusBox.textContent =
                "Password is required.";


            announce(
                "Password is required."
            );


            passwordInput.focus();

            return;

        }


        statusBox.style.display =
            "block";


        statusBox.textContent =
            "Logging in...";


        loginButton.disabled =
            true;


        announce(
            "Logging in. Please wait."
        );


        try {


            const response =
                await fetch(
                    "https://learning-universe-p57z.onrender.com/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {


                loginButton.disabled =
                    false;


                statusBox.textContent =
                    data.message ||
                    "Login failed.";


                announce(
                    data.message ||
                    "Login failed. Please check your email and password."
                );


                return;

            }


            /* SAVE USER */

            localStorage.setItem(
                "token",
                data.token
            );


            localStorage.setItem(
                "user",
                JSON.stringify(
                    data.user
                )
            );


            /* IMPORTANT:
               Keep selected mode.
            */

            localStorage.setItem(
                "accessibilityMode",
                mode
            );


            if (
                mode === "blind"
            ) {

                localStorage.setItem(
                    "voiceGuidance",
                    "enabled"
                );

            } else {

                localStorage.setItem(
                    "voiceGuidance",
                    "disabled"
                );

            }


            statusBox.textContent =
                "Login successful.";


            announce(
                "Login successful. Opening your accessibility dashboard."
            );


            setTimeout(
                function () {

                    window.location.href =
                        "disability-dashboard.html";

                },
                mode === "blind"
                    ? 1200
                    : 500
            );


        } catch (error) {


            console.error(
                "Login Error:",
                error
            );


            loginButton.disabled =
                false;


            statusBox.style.display =
                "block";


            statusBox.textContent =
                "Backend connection failed.";


            announce(
                "Backend connection failed. Please try again."
            );

        }

    }
);

</script>


</body>

</html>
