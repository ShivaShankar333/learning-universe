<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Learning Universe</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef3ff,
                    #f8f9ff
                );

        }


        .box {

            width: 90%;

            max-width: 430px;

            background: white;

            padding: 40px 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);

        }


        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #5875c7;

            text-decoration: none;

            font-weight: bold;

        }


        h1 {

            margin: 0 0 12px;

            text-align: center;

            color: #222;

            font-size: 30px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 28px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            margin-bottom: 18px;

            outline: none;

        }


        input:focus {

            border-color: #6c4df6;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6c4df6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.92;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .message {

            margin-top: 18px;

            text-align: center;

            line-height: 1.5;

        }


        .success {

            color: green;

        }


        .error {

            color: #d32f2f;

        }


        .login-link {

            margin-top: 22px;

            text-align: center;

            color: #777;

        }


        .login-link a {

            color: #5875c7;

            font-weight: bold;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <div class="box">


        <a
            class="back"
            href="regular-login.html"
        >
            ← Back to Login
        </a>


        <h1>
            Create New Password
        </h1>


        <p class="subtitle">

            Enter your new password below.

        </p>


        <form id="resetForm">


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="resetButton"
            >
                Reset Password
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="login-link">

            Remember your password?

            <a href="regular-login.html">
                Login
            </a>

        </div>


    </div>


    <script>

        const API_BASE_URL =
            "https://learning-universe-p57z.onrender.com";


        const RESET_PASSWORD_URL =
            API_BASE_URL +
            "/api/reset-password";


        // ----------------------------
        // GET RESET TOKEN FROM URL
        // ----------------------------

        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        const form =
            document.getElementById(
                "resetForm"
            );


        const button =
            document.getElementById(
                "resetButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        // ----------------------------
        // CHECK TOKEN
        // ----------------------------

        if (!token) {

            message.className =
                "message error";

            message.textContent =
                "Invalid or missing reset token.";

            button.disabled = true;

        }


        // ----------------------------
        // RESET PASSWORD
        // ----------------------------

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                // ------------------------
                // PASSWORD MATCH
                // ------------------------

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                // ------------------------
                // PASSWORD LENGTH
                // ------------------------

                if (
                    newPassword.length < 6
                ) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Resetting...";


                message.className =
                    "message";

                message.textContent =
                    "Updating your password...";


                try {

                    const response =
                        await fetch(
                            RESET_PASSWORD_URL,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        token:
                                            token,

                                        newPassword:
                                            newPassword

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {

                        message.className =
                            "message success";

                        message.textContent =
                            "Password reset successful! Redirecting to login...";


                        setTimeout(
    function () {

        const mode =
            new URLSearchParams(
                window.location.search
            ).get("mode");

        if (mode === "disability") {

            window.location.href =
                "disability-login.html";

        } else {

            window.location.href =
                "regular-login.html";

        }

    },
    2000
);

                    } else {

                        message.className =
                            "message error";

                        message.textContent =
                            data.message ||
                            "Unable to reset password.";

                    }


                } catch (error) {

                    console.error(
                        "Reset Password Error:",
                        error
                    );

                    message.className =
                        "message error";

                    message.textContent =
                        "Backend connection failed. Please try again.";

                }


                button.disabled = false;

                button.textContent =
                    "Reset Password";

            }
        );

    </script>


</body>

</html>
