<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disability Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 450px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .back {
            color: #6c4df6;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: #20243a;
        }

        .subtitle {
            text-align: center;
            color: #697188;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #30344b;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #6c4df6;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c4df6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #697188;
        }

        .login a {
            color: #6c4df6;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <a class="back" href="index.html">
        ← Back to Home
    </a>

    <h1>Disability Student Registration</h1>

    <p class="subtitle">
        Create your accessible learning account.
    </p>

    <form id="registerForm">

        <label for="name">
            Full Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            required
        >

        <label for="email">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Create Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <label for="disabilityType">
            Accessibility Support
        </label>

        <select id="disabilityType" required>

            <option value="">
                Select support type
            </option>

            <option value="visual">
                Visual Support
            </option>

            <option value="hearing">
                Hearing Support
            </option>

            <option value="mobility">
                Mobility Support
            </option>

            <option value="learning">
                Learning Support
            </option>

            <option value="other">
                Other
            </option>

        </select>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?
        <a href="disability-login.html">
            Login
        </a>
    </div>

</div>


<script>

const registerForm =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        message.style.display = "block";
        message.textContent = "Creating account...";


        try {

            const response = await fetch(
                "https://learning-universe-p57z.onrender.com/api/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        userType: "disability"
                    })
                }
            );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message || "Registration failed";

                return;
            }


            message.textContent =
                "Registration successful ✅";


            setTimeout(function() {

                window.location.href =
                    "disability-login.html";

            }, 800);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Backend connection failed. Make sure the server is running.";

        }

    }
);

</script>

</body>

</html>
